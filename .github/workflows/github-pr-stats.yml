name: Generate PR Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate PR Stats
        id: pr-stats
        uses: lonewolfyx-workflows/github-pr-stats@main
        with:
          username: lonewolfyx
          token: ${{ secrets.GITHUB_TOKEN }}
          output: profile/github-pr-stats.svg

      - name: Commit generated SVG
        run: |
          git config user.name "lonewolfyx"
          git config user.email "olddrivero.king@qq.com"
          git add -- profile/github-pr-stats.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile github pull request stats"
          git push
